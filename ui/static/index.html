<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- CSP：仅允许自身脚本与样式，禁止 Markdown 内容中注入的内联脚本执行（自用查看器的纵深防御） -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self' file: data: blob:; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src * file: data:">
<title>MD 查看器</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="no-sidebar">
<header id="toolbar">
  <button id="btn-open-folder" class="icon-btn" title="打开文件夹（列出其中所有 Markdown 文件）">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
  </button>
  <button id="btn-new-file" class="icon-btn" title="新建 Markdown 文件（Ctrl+N）">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15h6"/></svg>
  </button>
  <button id="btn-open-file" class="icon-btn" title="打开文件（Ctrl+O）">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-6"/><path d="M9 15h6"/></svg>
  </button>
  <button id="btn-refresh" class="icon-btn" title="刷新（重新扫描当前文件夹）">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
  </button>
  <button id="btn-sidebar" class="icon-btn" title="显示 / 隐藏左侧导航栏（Ctrl+B）">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
  </button>
  <span class="sep"></span>
  <div id="mode-switch">
    <button id="btn-mode-preview" class="icon-btn mode active" title="预览（渲染阅读模式）">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button id="btn-mode-edit" class="icon-btn mode" title="编辑（源码编辑模式）">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>
  </div>
  <button id="btn-code" class="icon-btn" disabled title="插入代码块（Ctrl+K，选择语言后插入围栏模板）">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 18l6-6-6-6"/><path d="M8 6l-6 6 6 6"/></svg>
  </button>
  <span class="sep"></span>
  <button id="btn-save" class="icon-btn" disabled title="保存当前文件（Ctrl+S）">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
  </button>
  <button id="btn-export" class="icon-btn" disabled title="导出为独立 HTML">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
  </button>
  <span id="current-file">未打开文件</span>
</header>

<div id="main">
  <aside id="sidebar">
    <div id="tree-header">
      <span>文件树</span>
      <span id="file-count"></span>
    </div>
    <nav id="file-tree"><div class="tree-empty">点击"打开文件夹"浏览 Markdown 文件</div></nav>
  </aside>
  <div id="sidebar-resizer" title="拖动调节导航栏宽度；双击恢复默认；Ctrl+B 隐藏/显示"></div>
  <div id="content">
    <div id="tabbar" title="Ctrl+W 关闭当前标签 · Ctrl+Tab 切换标签 · 中键点击关闭"></div>
    <div id="findbar" hidden>
      <input id="find-input" type="text" placeholder="查找（Enter 下一个 · Shift+Enter 上一个）">
      <span id="find-count">0/0</span>
      <button id="btn-find-prev" title="上一个（Shift+Enter）">↑</button>
      <button id="btn-find-next" title="下一个（Enter）">↓</button>
      <label class="find-option"><input type="checkbox" id="find-case"> 区分大小写</label>
      <span class="find-sep"></span>
      <input id="replace-input" type="text" placeholder="替换为">
      <button id="btn-replace" title="替换当前匹配">替换</button>
      <button id="btn-replace-all" title="替换全部匹配">全部替换</button>
      <button id="btn-find-close" title="关闭（Esc）">×</button>
    </div>
    <!-- 语言选择菜单：插入代码块时弹出（相对按钮定位） -->
    <div id="lang-menu" hidden></div>
    <div id="preview" class="markdown-body">
      <p class="preview-placeholder">把 .md 文件拖进窗口，或点击顶部按钮打开。<br>Ctrl+O 打开文件 · Ctrl+B 隐藏/显示导航栏 · Ctrl+F 查找 · 支持多标签。</p>
    </div>
    <div id="editor-wrap" hidden>
      <div id="editor-gutter">1</div>
      <textarea id="editor" spellcheck="false" wrap="soft"></textarea>
    </div>
  </div>
</div>

<footer id="statusbar"><span id="status-text">正在启动…</span></footer>

<script src="vendor/mermaid.min.js"></script>
<script src="app.js"></script>
</body>
</html>
